<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trade-Dex — Trade Pokémon GO</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="device">

  <div class="bezel">
    <div class="status-row">
      <div class="status-dots"><span></span><span></span><span></span></div>
      <div class="dex-label">TRADE·DEX</div>
      <div class="lens"></div>
    </div>
    <div class="trainer-line">
      <h1 id="trainerName">NilamTacos</h1>
      <span class="code-group">
        <span class="code" id="trainerCode">1898 4790 6821</span>
        <button class="copy-btn" id="copyBtn" onclick="copyTrainerCode()" aria-label="Copier le code ami">⧉</button>
      </span>
    </div>
  </div>

  <div class="content">
    <div class="meta-line" id="updatedLine"></div>
      <div class="filters" id="filterBar">
        <button class="filter-chip" data-filter="shiny">Shiny</button>
        <button class="filter-chip" data-filter="location">Location Background</button>
        <button class="filter-chip" data-filter="special">Special Background</button>
        <button class="filter-chip" data-filter="event">Event / costumed</button>
        <button class="filter-chip" data-filter="region">Region exclusive</button>
        <button class="filter-chip" data-filter="pvp">PVP</button>
      </div>
    <div class="panel cherche">
      <div class="panel-head"><span class="marker">›</span> Looking for</div>
      <div id="listCherche"></div>
    </div>

    <div class="panel echange">
      <div class="panel-head"><span class="marker">›</span> What I can offer</div>
      <div id="listEchange"></div>
    </div>
  </div>

  <div class="footer">
    <span class="hint">Let's trade !</span>
    <!--
    BOUTON IMPRIMER
   <button id="printBtn" onclick="window.print()">Imprimer</button>
    -->
  </div>

</div>

<!-- data.js = le seul fichier à modifier au quotidien -->
<script src="data.js"></script>
<!-- app.js = logique d'affichage, tu n'as jamais besoin d'y toucher -->
<script src="app.js"></script>
</body>
</html>
