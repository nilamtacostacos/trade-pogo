<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trade-Dex — Trade Pokémon GO</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="device">

  <div class="bezel">
    <div class="status-row">
      <div class="status-dots"><span></span><span></span><span></span></div>
      <div class="dex-label">TRADE·DEX</div>
      <div class="lens"></div>
    </div>
    <div class="trainer-line">
      <h1 id="trainerName">NilamTacos</h1>
      <span class="code-group">
        <span class="code" id="trainerCode">1898 4790 6821</span>
        <button class="copy-btn" id="copyBtn" onclick="copyTrainerCode()" aria-label="Copier le code ami">⧉</button>
      </span>
    </div>
  </div>

 <div class="content">
    <div class="meta-line" id="updatedLine"></div>

<div class="top-row">
  <div class="lang-switch" id="langSwitch">
    <button class="lang-btn active" data-lang="en">🇬🇧</button>
    <button class="lang-btn" data-lang="pt">🇵🇹</button>
    <button class="lang-btn" data-lang="fr">🇫🇷</button>
    <button class="lang-btn" data-lang="es">🇪🇸</button>
    <button class="lang-btn" data-lang="jp">🇯🇵</button>
  </div>

  <button class="intro-trigger" id="introTrigger" aria-label="Afficher le message">
    <svg class="pokeball-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <circle cx="12" cy="12" r="10" fill="#fff" stroke="var(--ink)" stroke-width="2"/>
      <path d="M2 12a10 10 0 0 1 20 0z" fill="var(--red)" stroke="var(--ink)" stroke-width="2"/>
      <line x1="2" y1="12" x2="22" y2="12" stroke="var(--ink)" stroke-width="2"/>
      <circle cx="12" cy="12" r="3.2" fill="#fff" stroke="var(--ink)" stroke-width="2"/>
    </svg>
    <span data-i18n="intro_label">Message</span>
    <span class="notif-dot" id="notifDot"></span>
  </button>
</div>
<!--  <span data-i18n="intro_label">Message</span>
  <span class="notif-dot" id="notifDot"></span>
</button>-->
<div class="intro-card" id="introCard" hidden>
  <p class="intro" id="introText"></p>
</div>
   
<div class="pager" id="pager">

  <div class="page">
    <div class="panel cherche">
  <div class="panel-head">
    <span class="marker">›</span> <span data-i18n="looking_for">Looking for</span>
    <button class="filter-toggle" data-toggle="cherche" aria-label="Afficher les filtres">
      <span class="arrow">▾</span> <span data-i18n="filters_btn">Filtres</span>
    </button>
  </div>
      
  <div class="filters" data-scope="cherche" id="filters-cherche">
      <button class="filter-chip" data-filter="shiny"><span data-i18n="tag_shiny">Shiny</span></button>
      <button class="filter-chip" data-filter="location"><span data-i18n="tag_location">Location Background</span></button>
      <button class="filter-chip" data-filter="special"><span data-i18n="tag_special">Special Background</span></button>
      <button class="filter-chip" data-filter="event"><span data-i18n="tag_event">Event / costumed</span></button>
      <button class="filter-chip" data-filter="region"><span data-i18n="tag_region">Region exclusive</span></button>
      <button class="filter-chip" data-filter="pvp"><span data-i18n="tag_pvp">PVP</span></button>
      <button class="filter-chip reset-chip" data-reset="cherche">✕ <span data-i18n="reset_filter">Reset filter</span></button>
      </div>
      <div id="listCherche"></div>
    </div>
  </div>

  <div class="page">
    <div class="panel echange">
      <div class="panel-head">
         <span class="marker">›</span> <span data-i18n="to_trade">To trade</span>
         <button class="filter-toggle" data-toggle="echange" aria-label="Afficher les filtres">
         <span class="arrow">▾</span> <span data-i18n="filters_btn">Filtres</span>
          </button>
      </div>
      
    <div class="filters" data-scope="echange" id="filters-echange">
      <button class="filter-chip" data-filter="shiny"><span data-i18n="tag_shiny">Shiny</span></button>
      <button class="filter-chip" data-filter="location"><span data-i18n="tag_location">Location Background</span></button>
      <button class="filter-chip" data-filter="special"><span data-i18n="tag_special">Special Background</span></button>
      <button class="filter-chip" data-filter="event"><span data-i18n="tag_event">Event / costumed</span></button>
      <button class="filter-chip" data-filter="region"><span data-i18n="tag_region">Region exclusive</span></button>
      <button class="filter-chip" data-filter="pvp"><span data-i18n="tag_pvp">PVP</span></button>
      <button class="filter-chip reset-chip" data-reset="echange">✕ <span data-i18n="reset_filter">Reset filter</span></button>
    </div>
      
      <div id="listEchange"></div>
    </div>
  </div>
</div>

  <div class="dots" id="dots">
    <button class="dot-ind active" data-page="0" aria-label="Page recherche"></button>
    <button class="dot-ind" data-page="1" aria-label="Page échange"></button>
  </div>

  
  <div class="footer">
    <span class="hint" data-i18n="footer_hint">Let's trade !</span>
    <!--
    BOUTON IMPRIMER
   <button id="printBtn" onclick="window.print()">Imprimer</button>
    -->
  </div>

</div>

<!-- data.js = le seul fichier à modifier au quotidien -->
<script src="data.js"></script>
<!-- app.js = logique d'affichage, tu n'as jamais besoin d'y toucher -->
<script src="app.js"></script>
</body>
</html>
