<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ma liste d'échanges Pokémon GO</title>
<style>
  :root {
    --rouge: #E3350D;
    --vert: #2A9D5C;
    --jaune: #FFCB05;
    --dark: #1a1a2e;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    margin: 0;
    background: #f4f4f8;
    color: var(--dark);
  }
  .wrap {
    max-width: 480px;
    margin: 0 auto;
    padding: 16px;
  }
  .header {
    background: var(--jaune);
    border: 4px solid var(--dark);
    border-radius: 14px;
    padding: 16px;
    text-align: center;
    margin-bottom: 16px;
  }
  .header h1 { margin: 0 0 6px 0; font-size: 1.6rem; }
  .header .code {
    font-family: 'Courier New', monospace;
    font-size: 1.1rem;
    font-weight: bold;
    background: #fff;
    border: 2px solid var(--dark);
    border-radius: 8px;
    padding: 4px 10px;
    display: inline-block;
    letter-spacing: 1px;
  }
  .updated {
    text-align: center;
    font-size: 0.8rem;
    color: #666;
    margin-bottom: 14px;
  }
  .section {
    border: 3px solid var(--dark);
    border-radius: 12px;
    margin-bottom: 16px;
    overflow: hidden;
  }
  .section h2 {
    margin: 0;
    padding: 10px 14px;
    font-size: 1.15rem;
    color: #fff;
  }
  .section.cherche h2 { background: var(--rouge); }
  .section.echange h2 { background: var(--vert); }
  .list { padding: 8px; background: #fff; }
  .row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 6px;
    border-bottom: 1px solid #eee;
    font-size: 1rem;
  }
  .row:last-child { border-bottom: none; }
  .row .name { flex: 1; font-weight: 600; }
  .tag {
    font-size: 0.7rem;
    font-weight: bold;
    color: #fff;
    padding: 2px 7px;
    border-radius: 6px;
  }
  .tag.shiny { background: #F4A200; }
  .tag.lucky { background: #7C4DFF; }
  .tag.pvp { background: #0288D1; }
  .footer-note {
    text-align: center;
    font-size: 0.85rem;
    color: #555;
    margin: 10px 0 20px 0;
  }
  #printBtn {
    display: block;
    width: 100%;
    padding: 12px;
    background: var(--dark);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
    margin-bottom: 20px;
  }
  @media print {
    body { background: #fff; }
    #printBtn { display: none; }
    .wrap { max-width: 100%; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <h1>🔄 Échanges Pokémon GO</h1>
    <div class="code">1234 5678 9012</div>
  </div>

  <div class="updated" id="updatedLine"></div>

  <div class="section cherche">
    <h2>😍 Je cherche</h2>
    <div class="list" id="listCherche"></div>
  </div>

  <div class="section echange">
    <h2>✅ J'échange</h2>
    <div class="list" id="listEchange"></div>
  </div>

  <button id="printBtn" onclick="window.print()">🖨️ Imprimer cette page</button>

  <div class="footer-note">Viens me voir sur place, on échange 🙂</div>

</div>

<script>
// ------------------------------------------------------------------
// MODIFIE UNIQUEMENT CETTE PARTIE pour mettre à jour ta liste.
// tag possibles : "shiny", "lucky", "pvp" (ou plusieurs, ou aucun)
// ------------------------------------------------------------------
const dateMaj = "29/07/2026";

const jeCherche = [
  { name: "Pokémon 1", tags: ["shiny"] },
  { name: "Pokémon 2", tags: ["lucky"] },
  { name: "Pokémon 3", tags: [] },
  { name: "Pokémon 4", tags: [] },
  { name: "Pokémon 5", tags: ["pvp"] },
];

const jEchange = [
  { name: "Pokémon A", tags: ["shiny"] },
  { name: "Pokémon B", tags: [] },
  { name: "Pokémon C", tags: [] },
  { name: "Pokémon D", tags: [] },
];
// ------------------------------------------------------------------

const tagLabel = { shiny: "S", lucky: "L", pvp: "P" };

function renderList(target, items) {
  const el = document.getElementById(target);
  el.innerHTML = items.map(item => `
    <div class="row">
      <div class="name">${item.name}</div>
      ${item.tags.map(t => `<span class="tag ${t}">${tagLabel[t]}</span>`).join("")}
    </div>
  `).join("");
}

renderList("listCherche", jeCherche);
renderList("listEchange", jEchange);
document.getElementById("updatedLine").textContent = "Mis à jour le " + dateMaj;
</script>

</body>
</html>
