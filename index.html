<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scan-Dex — Échanges Pokémon GO</title>
<style>
  :root {
    --red: #EE1515;
    --red-deep: #A80F0F;
    --ink: #14141c;
    --ink-soft: #23232f;
    --bg: #e9e9ee;
    --panel: #ffffff;
    --line: #d7d7de;
    --muted: #6b6b76;
    --gold: #FFCB05;
    --teal: #1E8E6B;
    --violet: #6C4FD1;
    --blue: #1976D2;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: -apple-system, "Segoe UI", system-ui, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    font-family: var(--sans);
    color: var(--ink);
    display: flex;
    justify-content: center;
    padding: 22px 12px 60px;
  }
  .device {
    width: 100%;
    max-width: 460px;
    background: var(--panel);
    border-radius: 22px;
    overflow: hidden;
    box-shadow: 0 18px 40px -14px rgba(20,20,28,0.35);
    border: 2px solid var(--ink);
  }

  /* --- header bezel --- */
  .bezel {
    background: linear-gradient(160deg, var(--ink) 0%, var(--ink-soft) 100%);
    padding: 16px 18px 20px;
    position: relative;
    overflow: hidden;
  }
  .bezel::after {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(180deg, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 3px);
    pointer-events: none;
  }
  .status-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .status-dots { display: flex; gap: 6px; }
  .status-dots span {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--red);
  }
  .status-dots span:nth-child(2) { background: var(--gold); }
  .status-dots span:nth-child(3) { background: var(--teal); }
  .dex-label {
    font-family: var(--mono);
    font-size: 0.68rem;
    letter-spacing: 2px;
    color: #ffffffaa;
    text-transform: uppercase;
  }
  .lens {
    width: 34px; height: 34px;
    border-radius: 50%;
    border: 2px solid #ffffff40;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .lens::before {
    content: "";
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--red);
    box-shadow: 0 0 0 4px rgba(238,21,21,0.2);
    animation: pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 4px rgba(238,21,21,0.20); }
    50% { box-shadow: 0 0 0 8px rgba(238,21,21,0.08); }
  }
  @media (prefers-reduced-motion: reduce) {
    .lens::before { animation: none; }
  }

  .trainer-line {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    color: #fff;
  }
  .trainer-line h1 {
    font-size: 1.35rem;
    margin: 0;
    letter-spacing: 0.5px;
  }
  .trainer-line .code {
    font-family: var(--mono);
    font-size: 0.82rem;
    color: var(--gold);
    letter-spacing: 1px;
  }

  /* --- content --- */
  .content { padding: 16px; }
  .meta-line {
    font-family: var(--mono);
    font-size: 0.72rem;
    color: var(--muted);
    text-align: right;
    margin-bottom: 14px;
  }

  .panel {
    border: 2px solid var(--ink);
    border-radius: 14px;
    margin-bottom: 14px;
    overflow: hidden;
  }
  .panel-head {
    font-family: var(--mono);
    font-size: 0.75rem;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #fff;
    padding: 8px 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .panel.cherche .panel-head { background: var(--red); }
  .panel.echange .panel-head { background: var(--teal); }
  .panel-head .marker { opacity: 0.75; }

  .row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-top: 1px solid var(--line);
    font-size: 0.98rem;
  }
  .row:first-of-type { border-top: none; }
  .row .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--line);
    flex-shrink: 0;
  }
  .row .name { flex: 1; font-weight: 600; }
  .tag {
    font-family: var(--mono);
    font-size: 0.65rem;
    font-weight: bold;
    letter-spacing: 0.5px;
    color: #fff;
    padding: 3px 7px;
    border-radius: 5px;
  }
  .tag.shiny { background: var(--gold); color: var(--ink); }
  .tag.lucky { background: var(--violet); }
  .tag.pvp { background: var(--blue); }

  .footer {
    padding: 14px 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-top: 2px dashed var(--line);
  }
  .footer .hint {
    font-size: 0.85rem;
    color: var(--muted);
  }
  #printBtn {
    font-family: var(--sans);
    font-weight: 700;
    font-size: 0.85rem;
    background: var(--ink);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 10px 16px;
    cursor: pointer;
  }
  #printBtn:hover { background: var(--red-deep); }

  @media print {
    body { background: #fff; padding: 0; }
    .device { box-shadow: none; max-width: 100%; }
    .bezel::after { display: none; }
    #printBtn { display: none; }
    .lens::before { animation: none; }
  }
</style>
</head>
<body>
<div class="device">

  <div class="bezel">
    <div class="status-row">
      <div class="status-dots"><span></span><span></span><span></span></div>
      <div class="dex-label">SCAN·DEX — TRADE MODE</div>
      <div class="lens"></div>
    </div>
    <div class="trainer-line">
      <h1 id="trainerName">PRÉNOM</h1>
      <span class="code" id="trainerCode">1234 5678 9012</span>
    </div>
  </div>

  <div class="content">
    <div class="meta-line" id="updatedLine"></div>

    <div class="panel cherche">
      <div class="panel-head"><span class="marker">›</span> Recherche active</div>
      <div id="listCherche"></div>
    </div>

    <div class="panel echange">
      <div class="panel-head"><span class="marker">›</span> Disponible à l'échange</div>
      <div id="listEchange"></div>
    </div>
  </div>

  <div class="footer">
    <span class="hint">Viens me voir, on scanne 👀</span>
    <button id="printBtn" onclick="window.print()">Imprimer</button>
  </div>

</div>

<script>
// ------------------------------------------------------------------
// MODIFIE UNIQUEMENT CETTE PARTIE pour mettre à jour ta liste.
// tags possibles : "shiny", "lucky", "pvp" (plusieurs possibles, ou [])
// ------------------------------------------------------------------
const trainerName = "PRÉNOM";
const trainerCode = "1234 5678 9012";
const dateMaj = "29/07/2026";

const jeCherche = [
  { name: "Pokémon 1", tags: ["shiny"] },
  { name: "Pokémon 2", tags: ["lucky"] },
  { name: "Pokémon 3", tags: [] },
  { name: "Pokémon 4", tags: [] },
  { name: "Pokémon 5", tags: ["pvp"] },
];

const jEchange = [
  { name: "Pokémon A", tags: ["shiny"] },
  { name: "Pokémon B", tags: [] },
  { name: "Pokémon C", tags: [] },
  { name: "Pokémon D", tags: [] },
];
// ------------------------------------------------------------------

const tagLabel = { shiny: "SHINY", lucky: "LUCKY", pvp: "PVP" };

function renderList(target, items) {
  document.getElementById(target).innerHTML = items.map(item => `
    <div class="row">
      <div class="dot"></div>
      <div class="name">${item.name}</div>
      ${item.tags.map(t => `<span class="tag ${t}">${tagLabel[t]}</span>`).join("")}
    </div>
  `).join("");
}

document.getElementById("trainerName").textContent = trainerName;
document.getElementById("trainerCode").textContent = trainerCode;
document.getElementById("updatedLine").textContent = "SYNC — " + dateMaj;
renderList("listCherche", jeCherche);
renderList("listEchange", jEchange);
</script>

</body>
</html>
